[package]
name = "guif-pdf"
version = "0.1.0"
edition = "2021"
description = "guif-pdf - PDF Viewer, Annotator & Page Manipulation Tool"

[lib]
name = "guif_pdf_lib"
path = "src/lib.rs"

[[bin]]
name = "guif-pdf"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
