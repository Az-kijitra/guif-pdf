## ======================================================================
## guif @VERSION@ の設定ファイル(config.toml)
## ======================================================================
#@template このファイルは自由に編集できます。アプリはこのファイルを書き換えません。
#@sample このファイルは見本です。アプリが起動のたびに最新の内容に書き直すため、編集しても元に戻ります。設定は config.toml に書いてください。
##
## 場所: guif の設定フォルダー(%APPDATA%\dev.guif.app)の config.toml
## 設定できること: 配色([theme] / [colors])、一覧のフォント([font])、画面の配置([layout])、キー割り当て([input_keymap_custom])、外部アプリで開く([[external_apps]])
## 設定の画面はありません。このファイルをテキストエディターで編集します。
## メニューの「ファイル」の「設定ファイルを開く」(Ctrl+,)で、このファイルを VS Code などで開けます。
##
## このファイルの読み方:
##   「## 」で始まる行は説明です。
##   「# 」で始まる行は設定の行です。右辺に書いてある値が、書かないときに使われる既定の値です。
##   変えたい設定は、その設定の行(表の中の設定は、その表の見出しの行も)の先頭の「# 」を消してから、値を書き換えます。
##   「# 」を消した行だけが設定として読まれます。消していない行は、書いていないのと同じです。
##
## 設定の反映: 変更は guif を再起動したときに反映されます。起動中は読み直しません。
## 設定の確認: メニューの「ファイル」の「設定ファイルのチェック」で、書き方に誤りがないかを確かめられます。
##   確かめるだけで、設定は変わりません。結果は「次に起動したときの扱い」を表します。
##   起動のときにも同じチェックをします。誤りがあると、ステータスバーに行と設定項目を表示します。
##   誤りのある項目だけが既定の設定になり、正しい項目はそのまま使われます。
##   ファイル全体を TOML として読めないときは、すべて既定の設定で起動します。
## 詳しい説明: ユーザーマニュアルの §6(キー割り当て)、§6.2(配色・フォント・配置)、§7(外部アプリで開く)。
##
## ----------------------------------------------------------------------
## 配色([theme] / [colors])
## ----------------------------------------------------------------------
## 画面全体(メインの画面とビューア)の色を決めます。OS の明るさの設定(ライト / ダーク)には従いません。
## 明るい配色か暗い配色かは、背景の色(bg)から自動で決まります。タイトルバーの明暗もこれに従います。
##
## 画面の配色の設定は、以前の ui_theme から変わりました。ui_theme は廃止しました。書いても使われず、
##   不明な設定として知らせます。最上位に theme = "nord" と書く形も、設定行にはしていません(見本には書きません)。
##   配色は次の [theme] の preset で選んでください。
##
## [theme] の preset: 配色の名前(プリセット)を選びます。書かないときは nord です。
##   選べる名前: default、nord、monokai、catppuccin、solarized、light
##     (catppuccin は catppuccinmocha、solarized は solarizeddark とも書けます。light だけが明るい配色です。)
##   大文字小文字は区別せず、「-」「_」と空白は無視して比べます(例: "Solarized-Dark" と "solarized" は同じです)。
##   表の中では preset、name、theme のどれでも同じ意味で、preset → name → theme の順で最初に見つかったものを使い、残りは使われない設定として知らせます。
##   preset を使うことをお勧めします。
##   一覧にない名前、文字列でない値のときは、nord を使い、起動時にステータスバーへ行と一緒に知らせます。
# [theme]
# preset = "nord"

## [colors]: プリセットの色を、項目ごとに上書きします。書いた項目だけが変わり、書かない項目はプリセットの色のままです。
##   ここに書いてある値は、nord の色です(上書きしたい項目の行の先頭の「# 」を消して、値を書き換えます)。
##   [colors] の見出しの行の「# 」も一緒に消してください。見出しがないと、項目は設定になりません。
##   色の書き方: "#RRGGBB"(例: "#2E3440")、"#RGB"(例: "#0AF" は "#00AAFF")、
##     0〜255 の色番号(例: "208")、色名(例: "red"、"dark_gray"、"light_blue"。大文字小文字は区別しません)。
##     "reset"(別名 "default"、"none")は、背景の項目では黒、それ以外の項目では端末の文字の色になります。
##   書き方が正しくない項目は、その項目だけプリセットの色になり、起動時にステータスバーへ行と一緒に知らせます。
##   知らない項目名は不明な設定として知らせ、使いません。
##   項目名の別名: background は bg、selected_mark は selected と同じです(同じ項目を両方で書いたときは bg と selected_mark が使われ、もう一方は使われない設定として知らせます)。
##
## 各項目の使いみち:
##   bg 全体の背景  border アクティブなペイン・ダイアログ・メニューの枠  border_inactive 非アクティブなペインの枠・区切り線
##   cursor_fg / cursor_bg カーソル行の文字・背景  folder フォルダー名  file ファイル名と本文の文字
##   symlink シンボリックリンク(今は画面のどこにも使いません)  executable 実行ファイル  selected 選択した項目のしるし
##   status_bar_fg / status_bar_bg ステータスバーの文字・背景  menu_bar_active_fg / menu_bar_active_bg 開いているメニューの文字・背景
##   tree_current ツリーで今開いているフォルダー  tree_cursor ツリーのカーソル
# [colors]
# bg = "#2E3440"
# border = "#88C0D0"
# border_inactive = "#4C566A"
# cursor_fg = "#2E3440"
# cursor_bg = "#8FBCBB"
# folder = "#81A1C1"
# file = "#ECEFF4"
# symlink = "#B48EAD"
# executable = "#A3BE8C"
# selected = "#EBCB8B"
# status_bar_fg = "#E5E9F0"
# status_bar_bg = "#3B4252"
# menu_bar_active_fg = "#2E3440"
# menu_bar_active_bg = "#88C0D0"
# tree_current = "#88C0D0"
# tree_cursor = "#EBCB8B"

## ----------------------------------------------------------------------
## フォント([font])
## ----------------------------------------------------------------------
## メイン画面のすべての文字(メニュー、パス欄、ステータスバー、検索バー、右クリックメニュー、ダイアログ、ファイルの一覧、フォルダーのツリー)のフォントと大きさを決めます。
## ビューアのウィンドウは、この設定の対象ではありません(変わりません)。
## family: フォントの家族名です。文字列、または文字列の配列(例: ["Consolas", "BIZ UDGothic"])で書きます。
##   書いた名前を先に試し、使えない名前は飛ばして、次の名前を使います。最後は、次の既定の並びが続きます。
##   既定の並び: JetBrains Mono、JetBrainsMono NFM、JetBrainsMono NF、Cascadia Mono、Consolas、BIZ UDGothic、monospace
##   等幅のフォントを選んでください(等幅でないと、列が揃わないことがあります)。書かない、または空の名前だけのときは、既定の並びです。
##   誤りのあるとき(起動時に、ステータスバーへ行と一緒に知らせます):
##     family 全体が、文字列でも配列でもないとき、または配列に文字列でない要素が1つでもあるときは、family 全体を使わず、既定の並びにします。
##     配列の中の空の文字列("")の要素は、知らせずに黙って除きます。
##     空白だけの要素と、制御文字を含む要素は、その要素だけを除き、残りの名前を使います。
## size: 文字の大きさ(px)です。10〜24 の整数で、既定は 12 です。メイン画面のすべての文字がこの大きさになります。行の高さは大きさに合わせて決まります(12 のとき 16px)。
##   範囲の外の値、整数でない値は 12 にし、起動時にステータスバーへ行と一緒に知らせます。
# [font]
# family = "JetBrains Mono"
# size = 12

## ----------------------------------------------------------------------
## 画面の配置([layout])
## ----------------------------------------------------------------------
## min_col_width: 一覧の列の最小の幅です。文字の数で数え、10〜80 の整数、既定は 24 です。
##   ウィンドウが狭いときに、列がこれより狭くならないようにします。サイズの列や更新日時の列を出すときは、その分(サイズで +10 文字、更新日時で +20 文字)も最小の幅に加わります。
##   範囲の外の値、整数でない値は既定の 24 にし、起動時にステータスバーへ行と一緒に知らせます。
## tree_width_percent: フォルダーのツリーを出すときの、ツリーの幅の割合(%)です。10〜50 の整数、既定は 24 です。
##   範囲の外の値、整数でない値は既定の 24 にし、起動時にステータスバーへ行と一緒に知らせます。
# [layout]
# min_col_width = 24
# tree_width_percent = 24

## ----------------------------------------------------------------------
## キー割り当て([input_keymap_custom])
## ----------------------------------------------------------------------
## 操作ごとのキーを変えます。書いた操作だけが既定から変わり、書かない操作は既定のキーのままです。
## 使うときは、下の「# [input_keymap_custom]」の先頭の「# 」を消してから、変えたい操作の行の「# 」を消します。
## すべての操作を書いておくと、後の版で既定のキーが変わっても反映されなくなります。変えたい操作だけを書くことをお勧めします。
##
## 書き方: 操作の ID = "キー"
##   例: copy = "Ctrl+Shift+C"
##   空の文字列("")を書くと、その操作にはキーが割り当てられなくなります。例: zip_create = ""
##   カンマで区切ると、1つの操作に複数のキーを割り当てられます。例: move_down = "ArrowDown,J"
##   修飾キー(Ctrl、Alt、Shift、Meta)を + でつなぎ、最後にキー本体を書きます。例: Ctrl+Shift+N
##   修飾キーの順序は問いません(Ctrl、Alt、Shift、Meta の順に書くと読みやすくなります)。
##   修飾キーの名前と、キー本体の名前は、大文字小文字を区別しません。
##   キー本体は、英数字や / などの1文字(, と + を除く)か、次の名前です。
##     ArrowUp、ArrowDown、ArrowLeft、ArrowRight、Enter、Escape、Delete、Backspace、Tab、Space、
##     Home、End、PageUp、PageDown、F1〜F12、Comma、Plus、Minus、Dot
##   , と + はそのままでは書けません(, は複数のキーの区切り、+ は連結に使うため)。Comma と Plus と書きます。
##   例: Ctrl+Comma、Ctrl+Plus。スペースは Space、- は Minus、. は Dot と書きます。
##   上の名前にない2文字以上の名前は、キー割り当てとして受け付けられません。
##
## 次のキーは固定されていて、どの操作にも割り当てられません(外部アプリのキーにも使えません)。
##   Ctrl+Q、Ctrl+,、Shift+Enter、Shift+Delete、Tab、Shift+Tab、F10、Alt+F、Alt+E、Alt+V、Alt+G
##   (Ctrl+Q は終了、Ctrl+, は設定ファイルを開く、Shift+Enter はOSの関連付けで開く、Shift+Delete は完全削除、
##    F10 と Alt+F / Alt+E / Alt+V / Alt+G はメニューバーを開くキーです。)
##
## 誤りがあるとき: 知らない操作の ID、書き方の誤ったキー、delete に Shift を含めたキーなどは、
##   その操作だけが既定のキーになり、起動時にステータスバーへ行と一緒に表示されます。
##   input_keymap_custom が表になっていないときは、すべての操作が既定のキーになります。
##
## 操作の ID と既定のキーは、次のとおりです。
# [input_keymap_custom]
## 上へ移動: フォーカスを1つ上の項目へ動かします。
# move_up = "ArrowUp,K"
## 下へ移動: フォーカスを1つ下の項目へ動かします。
# move_down = "ArrowDown,J"
## 左へ移動: 左へ動かします。ツリーでは、フォルダーを折りたたむ、または親のフォルダーへ移ります。
# move_left = "ArrowLeft,H"
## 右へ移動: 右へ動かします。ツリーでは、フォルダーを展開する、または子のフォルダーへ移ります。
# move_right = "ArrowRight,L"
## 前のページ: 1画面分、上へ動かします。
# page_up = "PageUp,Ctrl+U"
## 次のページ: 1画面分、下へ動かします。
# page_down = "PageDown,Ctrl+D"
## 選択の切り替え: フォーカスのある項目の選択と選択の解除を切り替えます。ツリーではフォルダーの開閉(展開/折りたたみ)を切り替えます。
# select_toggle = "Space,V"
## すべて選択: 一覧に表示している項目をすべて選択します。
# select_all = "Ctrl+A,Shift+V"
## 選択の解除: 選択している項目をすべて解除します。
# clear_selection = "Escape"
## 開く: フォルダーなら中へ移動します。ファイルならビューアなどで開きます。
## (Shift+Enter でOSの関連付けで開く操作は固定で、変えられません。)
# open = "Enter"
## 親フォルダーへ: 1つ上のフォルダーへ移動します。
# go_parent = "Backspace,Minus"
## 終了: guif を終了します。ここを変えても、Ctrl+Q は固定のキーとして終了のままです。
# exit = "Ctrl+Q"
## 設定ファイルを開く: この config.toml を VS Code で開きます。VS Code が見つからないときは、Windows の関連付けで開きます。
## ここを変えても、Ctrl+, は固定のキーとして設定ファイルを開くままです。
# settings = "Ctrl+Comma"
## パス欄へ移動: パス欄に入力のカーソルを移します。
# focus_path = "Ctrl+L"
## 隠しファイルの表示の切り替え: 隠しファイルを表示する、しないを切り替えます。
# toggle_hidden = "Ctrl+H,Dot"
## ツリーの表示の切り替え: フォルダーのツリーを表示する、しないを切り替えます。
# toggle_tree = "Ctrl+Shift+B,T"
## コピー: 選択した項目(選択がなければフォーカスのある項目)をクリップボードへコピーします。
# copy = "Ctrl+C,Y"
## 切り取り: 選択した項目をクリップボードへ切り取ります。貼り付けると移動になります。
# cut = "Ctrl+X,X"
## 貼り付け: クリップボードの項目を現在のフォルダーに貼り付けます。
# paste = "Ctrl+V,P"
## 削除(ごみ箱へ): 選択した項目をごみ箱へ移します。
## Shift を加えた Shift+Delete は完全削除です(復元できません)。このため、delete に Shift を含むキーは割り当てられません。
# delete = "Delete,D"
## 名前の変更: フォーカスのある項目の名前を変えます。
# rename = "F2,R"
## 新規作成: 新しいファイルを作ります。
# new_file = "Ctrl+N,A"
## 検索: 検索バーを開き、現在のフォルダーの中から探します。
# search = "/"
## 並び替え: 並び順を選ぶメニューを開きます。
# sort_menu = "S"
## ジャンプリスト: 登録したフォルダーの一覧を開きます。
# history_jump_list = "Ctrl+J"
## ジャンプリストに追加: 現在のフォルダーをジャンプリストに登録します。
# jump_add = "Ctrl+Shift+J,M"
## 新しいフォルダー: 新しいフォルダーを作ります。
# new_folder = "Ctrl+Shift+N,Shift+A"
## 履歴: 訪問したフォルダーの履歴を開きます。
# history = "Ctrl+Y"
## サイズの列の表示の切り替え: 一覧のサイズの列を表示する、しないを切り替えます。
# toggle_size = "Ctrl+Shift+S"
## 更新日時の列の表示の切り替え: 一覧の更新日時の列を表示する、しないを切り替えます。
# toggle_time = "Ctrl+Shift+T"
## ZIPに圧縮: 選択した項目をZIPに圧縮します。
# zip_create = "Ctrl+Alt+Z,Z"
## ZIPを展開: 選択したZIPファイルを展開します。
# zip_extract = "Ctrl+Alt+X,Shift+Z"
## ファイルのファジー検索: カレントフォルダー配下のファイルを再帰的に検索してジャンプします。
# fuzzy_find_file = "Ctrl+P,Ctrl+F"

## ----------------------------------------------------------------------
## 外部アプリで開く([[external_apps]])
## ----------------------------------------------------------------------
## 選択したフォルダーやファイルを、ほかのアプリで開く項目を登録します。
## 登録した項目は、メニューバーの「ファイル」の「OSの関連付けで開く」の後と、右クリックメニューに並び、登録ごとに決めたキーでも使えます。
##
## 注意: external_apps を書くと、書いたものだけが使われ、既定の4つは使われません。
##   書かないときは、下の4つの登録を書いた場合とまったく同じです(既定の4つ)。
##   既定の4つに項目を足したいときは、下の4つも書き写して(先頭の「# 」を消して)から、足してください。
##   登録を1つも使わないときは、最初の表の見出しより前に external_apps = [] と書きます。
##
## 書き方: [[external_apps]] の見出しの後に、1つの登録を書きます。
##   上から順にメニューに並びます。登録できるのは最大 20 件です(21 件目以降は使われません)。
##   name          (必須)メニューの項目名と表示に使う名前です。
##   program       (必須)起動する実行ファイルです。
##                 絶対パス(例: C:\\Tools\\app.exe)か、区切りのない名前(例: wt.exe)で書きます。
##                 名前だけのときは、環境変数 PATH のフォルダーから探します。
##                 実行ファイルは .exe に限ります(.bat、.cmd、.ps1、ショートカットの .lnk は使えません)。
##                 %LOCALAPPDATA% のように %名前% と書くと、起動時に環境変数の値に置き換えます。
##                 TOML の文字列の中では、\ を \\ と書きます。
##   args          (任意)引数の配列です。書かなければ引数なしです。
##   args_for_file (任意)対象がファイルのときの引数の配列です。書かなければ args を使います。
##   key           (任意)キーです。書き方は [input_keymap_custom] と同じです(カンマで区切って複数書けます)。
##                 書かなければキーなしです。固定のキー、現在のキー割り当てで使っているキー、
##                 先に並ぶ登録が使っているキーは使えません。
##
## 引数の中では、次の書き方が置き換えられます。
##   {path}   対象のパス(フォルダーならそのフォルダー、ファイルならそのファイル)
##   {dir}    対象のフォルダー(フォルダーならそのフォルダー、ファイルならファイルのあるフォルダー)
##   {{ と }} 文字の { と }
##   置き換えは要素の一部でもかまいません(例: "--folder={dir}")。
##   1つの要素は、空白を含んでいても1つの引数として渡ります。上の表にない書き方は、正しくない登録になります。
##
## 誤りがあるとき: 正しくない登録(必須の項目がない、型が違う、プログラムの書き方が正しくない、21 件目以降など)は使われず、
##   起動時にステータスバーへ番号と行が表示されます。external_apps 全体が配列でないときは、既定の4つが使われます。
##
## 既定の4つの登録は、次のとおりです。
##
## ターミナルで開く: Windows Terminal を、そのフォルダー(ファイルならファイルのあるフォルダー)で開きます。
# [[external_apps]]
# name = "ターミナルで開く"
# program = "wt.exe"
# args = ["-d", "{dir}"]
# key = "Ctrl+Alt+C"

## VS Codeで開く: そのフォルダー、またはそのファイルを VS Code で開きます。
# [[external_apps]]
# name = "VS Codeで開く"
# program = "%LOCALAPPDATA%\\Programs\\Microsoft VS Code\\Code.exe"
# args = ["{path}"]
# key = "Ctrl+Alt+V"

## エクスプローラーで開く: そのフォルダーを開きます。ファイルのときは、ファイルのあるフォルダーを、そのファイルを選んだ状態で開きます。
## args_for_file の "/select," と "{path}" は、2つの要素に分けて書きます(1つにすると、パスに空白があるとき正しく渡りません)。
# [[external_apps]]
# name = "エクスプローラーで開く"
# program = "%SystemRoot%\\explorer.exe"
# args = ["{dir}"]
# args_for_file = ["/select,", "{path}"]
# key = "Ctrl+Alt+E"

## GitHub Desktopで開く: そのフォルダー(ファイルならファイルのあるフォルダー)で GitHub Desktop を開きます。
